<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>XDX/XRP Live Chart - Minimal Test</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body {
      margin: 0;
      background: #0d1117;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #chart {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="chart"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("chart");

      console.log("Container:", container);
      console.log("LightweightCharts:", typeof LightweightCharts);

      if (!container) {
        console.error("Chart container not found");
        return;
      }

      if (typeof LightweightCharts === "undefined") {
        console.error("LightweightCharts library not loaded");
        return;
      }

      const chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: {
          background: { color: "#0d1117" },
          textColor: "#d1d5db",
        },
        grid: {
          vertLines: { color: "#1f2937" },
          horzLines: { color: "#1f2937" },
        },
        timeScale: {
          borderColor: "#1f2937",
        },
        rightPriceScale: {
          borderColor: "#1f2937",
        },
      });

      const series = chart.addCandlestickSeries({
        upColor: "#22c55e",
        downColor: "#ef4444",
        borderVisible: false,
        wickUpColor: "#22c55e",
        wickDownColor: "#ef4444",
      });

      // Simple dummy data: 50 candles, 1‑minute apart
      const now = Math.floor(Date.now() / 1000);
      const candles = [];
      let price = 0.0005;

      for (let i = 0; i < 50; i++) {
        const t = now - (50 - i) * 60;
        const open = price;
        const close = price * (1 + (Math.random() - 0.5) * 0.05);
        const high = Math.max(open, close) * 1.02;
        const low = Math.min(open, close) * 0.98;

        candles.push({ time: t, open, high, low, close });
        price = close;
      }

      console.log("Setting data, candles length:", candles.length);
      series.setData(candles);

      // Resize handling
      window.addEventListener("resize", () => {
        chart.applyOptions({
          width: container.clientWidth,
          height: container.clientHeight,
        });
      });
    });
  </script>
</body>
</html>
