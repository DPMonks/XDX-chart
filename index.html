<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>XRP/USD Live Chart</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { margin: 0; background: #0d1117; }
    #chart { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="chart"></div>

  <script>
    const chart = LightweightCharts.createChart(document.getElementById("chart"), {
      layout: { background: { color: "#0d1117" }, textColor: "#d1d5db" },
      grid: { vertLines: { color: "#1f2937" }, horzLines: { color: "#1f2937" } }
    });

    const series = chart.addCandlestickSeries();

    async function getXRPCandles() {
      const target = "https://api.coingecko.com/api/v3/coins/ripple/ohlc?vs_currency=usd&days=1";

      // CORS-safe proxy
      const url = "https://api.allorigins.win/raw?url=" + encodeURIComponent(target);

      const res = await fetch(url);
      const data = await res.json();

      if (!Array.isArray(data)) {
        console.error("Invalid OHLC data:", data);
        return [];
      }

      return data.map(c => ({
        time: Math.floor(c[0] / 1000),
        open: c[1],
        high: c[2],
        low: c[3],
        close: c[4]
      }));
    }

    async function loadChart() {
      const candles = await getXRPCandles();
      if (candles.length > 0) {
        series.setData(candles);
      }
    }

    loadChart();

    // Auto-refresh every minute
    setInterval(loadChart, 60000);
  </script>
</body>
</html>
