<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>XDX Neon Chart</title>
<style>
    body {
        margin: 0;
        background: #000;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #chart {
        width: 100vw;
        height: 100vh;
    }

    /* Neon glow effect using CSS filters */
    .neon-candle {
        filter: drop-shadow(0 0 6px rgba(255,0,0,0.9))
                drop-shadow(0 0 12px rgba(255,0,0,0.6));
    }

    .neon-candle-green {
        filter: drop-shadow(0 0 6px rgba(0,255,0,0.9))
                drop-shadow(0 0 12px rgba(0,255,0,0.6));
    }
</style>
</head>
<body>

<div id="chart"></div>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<script>
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
        layout: {
            background: { color: '#000000' },
            textColor: '#ffffff',
        },
        grid: {
            vertLines: { color: 'rgba(255,255,255,0.05)' },
            horzLines: { color: 'rgba(255,255,255,0.05)' },
        },
        crosshair: {
            mode: LightweightCharts.CrosshairMode.Normal,
        },
        timeScale: {
            borderColor: 'rgba(255,255,255,0.1)',
        },
        rightPriceScale: {
            borderColor: 'rgba(255,255,255,0.1)',
        },
    });

    const candleSeries = chart.addCandlestickSeries({
        upColor: '#00ff00',
        downColor: '#ff0000',
        borderUpColor: '#00ff00',
        borderDownColor: '#ff0000',
        wickUpColor: '#00ff00',
        wickDownColor: '#ff0000',
    });

    // Dummy data for design preview
    candleSeries.setData([
        { time: '2024-01-01', open: 1, high: 3, low: 1, close: 2 },
        { time: '2024-01-02', open: 2, high: 4, low: 2, close: 3 },
        { time: '2024-01-03', open: 3, high: 3.5, low: 2, close: 2.2 },
        { time: '2024-01-04', open: 2.2, high: 5, low: 2, close: 4.5 },
    ]);

    // Apply neon glow to canvas elements
    const applyNeonGlow = () => {
        const canvases = document.querySelectorAll('canvas');
        canvases.forEach(c => {
            c.classList.add('neon-candle');
        });
    };

    setTimeout(applyNeonGlow, 300);
</script>

</body>
</html>
