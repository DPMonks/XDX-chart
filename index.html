<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>XDX/XRP Live Chart</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { margin: 0; background: #0d1117; }
    #chart { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="chart"></div>

  <script>
    const API = "https://s1.ripple.com:51234/";
    const XDX = {
      currency: "XDX",
      issuer: "rMJAXYsbNzhwp7FfYnAsYP5ty3R9XnurPo"
    };

    async function getMidPrice() {
      const body = {
        method: "book_offers",
        params: [{
          taker_gets: { currency: "XRP" },
          taker_pays: XDX,
          limit: 1
        }]
      };

      try {
        const res = await fetch(API, {
          method: "POST",
          body: JSON.stringify(body)
        });
        const json = await res.json();
        const offer = json.result.offers?.[0];
        if (!offer) {
          console.log("No offers found — using fallback price");
          return 0.0001;
        }
        const pays = parseFloat(offer.TakerPays.value);
        const gets = parseFloat(offer.TakerGets);
        const price = pays / gets;
        console.log("Live price:", price);
        return price;
      } catch (e) {
        console.error("XRPL fetch error:", e);
        return 0.0001;
      }
    }

    async function buildInitialCandles() {
      const candles = [];
      for (let i = 0; i < 50; i++) {
        const price = await getMidPrice();
        const t = Math.floor(Date.now() / 1000) - (50 - i) * 60;
        candles.push({ time: t, open: price, high: price, low: price, close: price });
        await new Promise(r => setTimeout(r, 200));
      }
      return candles;
    }

    async function init() {
      const chart = LightweightCharts.createChart(document.getElementById("chart"), {
        layout: { background: { color: "#0d1117" }, textColor: "#d1d5db" },
        grid: { vertLines: { color: "#1f2937" }, horzLines: { color: "#1f2937" } }
      });

      const series = chart.addCandlestickSeries();
      const candles = await buildInitialCandles();
      series.setData(candles);

      setInterval(async () => {
        const price = await getMidPrice();
        const t = Math.floor(Date.now() / 1000);
        candles.push({ time: t, open: price, high: price, low: price, close: price });
        series.update(candles[candles.length - 1]);
      }, 5000);
    }

    init();
  </script>
</body>
</html>
