<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>XDX/XRP Live Chart</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { margin: 0; background: #0d1117; }
    #chart { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="chart"></div>

  <script>
  const chart = LightweightCharts.createChart(document.getElementById("chart"), {
    layout: { background: { color: "#0d1117" }, textColor: "#d1d5db" },
    grid: { vertLines: { color: "#1f2937" }, horzLines: { color: "#1f2937" } }
  });

  const series = chart.addCandlestickSeries();

  // Simple dummy candles to prove rendering
  const now = Math.floor(Date.now() / 1000);
  const candles = [
    { time: now - 240, open: 0.0001, high: 0.00012, low: 0.00009, close: 0.00011 },
    { time: now - 180, open: 0.00011, high: 0.00013, low: 0.0001, close: 0.00012 },
    { time: now - 120, open: 0.00012, high: 0.00014, low: 0.00011, close: 0.00013 },
    { time: now - 60,  open: 0.00013, high: 0.00015, low: 0.00012, close: 0.00014 },
    { time: now,       open: 0.00014, high: 0.00016, low: 0.00013, close: 0.00015 }
  ];

  series.setData(candles);
</script>

</body>
</html>
