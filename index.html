<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>XDX/XRP Live Chart</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body {
      margin: 0;
      background: #0d1117;
    }
    #chart {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="chart"></div>

  <script>
    const chart = LightweightCharts.createChart(document.getElementById("chart"), {
      layout: {
        background: { color: "#0d1117" },
        textColor: "#d1d5db"
      },
      grid: {
        vertLines: { color: "#1f2937" },
        horzLines: { color: "#1f2937" }
      }
    });

    const series = chart.addCandlestickSeries();

    // Fetch live XDX/XRP price from XRPL.Services
    async function getLivePrice() {
      try {
        const res = await fetch("https://xrpl.services/api/v1/token/XDX");
        const data = await res.json();
        return parseFloat(data.price_xrp);
      } catch (e) {
        console.error("XRPL fetch error:", e);
        return null;
      }
    }

    // Build initial candles
    async function buildInitialCandles() {
      const candles = [];
      for (let i = 0; i < 50; i++) {
        const price = await getLivePrice() || 0.0001;
        const t = Math.floor(Date.now() / 1000) - (50 - i) * 60;
        candles.push({ time: t, open: price, high: price * 1.02, low: price * 0.98, close: price });
        await new Promise(r => setTimeout(r, 200));
      }
      return candles;
    }

    async function init() {
      const candles = await buildInitialCandles();
      series.setData(candles);

      // Update every 10 seconds
      setInterval(async () => {
        const price = await getLivePrice();
        if (!price) return;
        const t = Math.floor(Date.now() / 1000);
        const candle = { time: t, open: price, high: price * 1.02, low: price * 0.98, close: price };
        candles.push(candle);
        series.update(candle);
      }, 10000);
    }

    init();
  </script>
</body>
</html>
