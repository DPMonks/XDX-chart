<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>GBP/USD Chart</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { margin: 0; background: #0d1117; }
    #chart { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="chart"></div>

  <script>
    const API_KEY = "demo"; // replace with your key
    const URL = `https://api.twelvedata.com/time_series?symbol=GBP/USD&interval=1min&apikey=${API_KEY}`;

    async function getForexCandles() {
      const res = await fetch(URL);
      const json = await res.json();
      return json.values.reverse().map(c => ({
        time: Math.floor(new Date(c.datetime).getTime() / 1000),
        open: parseFloat(c.open),
        high: parseFloat(c.high),
        low: parseFloat(c.low),
        close: parseFloat(c.close)
      }));
    }

    async function init() {
      const chart = LightweightCharts.createChart(document.getElementById("chart"), {
        layout: { background: { color: "#0d1117" }, textColor: "#d1d5db" },
        grid: { vertLines: { color: "#1f2937" }, horzLines: { color: "#1f2937" } }
      });

      const series = chart.addCandlestickSeries();

      const candles = await getForexCandles();
      series.setData(candles);

      setInterval(async () => {
        const candles = await getForexCandles();
        series.update(candles[candles.length - 1]);
      }, 60000);
    }

    init();
  </script>
</body>
</html>
